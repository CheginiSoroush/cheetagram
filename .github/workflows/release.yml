name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and AAB
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease :TMessagesProj_App:bundleBundleAfatRelease --stacktrace

      - name: Collect artifacts
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          mkdir -p release-out
          cp TMessagesProj_App/build/outputs/apk/afat/release/*.apk "release-out/Cheetagram-v${VERSION}-${CODE}.apk"
          cp TMessagesProj_App/build/outputs/bundle/bundleAfatRelease/*.aab "release-out/Cheetagram-v${VERSION}-${CODE}.aab" 2>/dev/null || true
          cp TMessagesProj_App/build/outputs/mapping/*/*.txt "release-out/mapping.txt" 2>/dev/null || true
          ls -la release-out

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
